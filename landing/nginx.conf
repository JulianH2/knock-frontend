# Landing de Knock (TT-WEB-01). Reemplaza /etc/nginx/conf.d/default.conf.
# No declarar add_header dentro de un location: nginx dejaría de heredar estas
# cabeceras. Por eso la caché usa expires y no add_header.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex off;
    # Redirecciones con ruta relativa: detrás del proxy de Railway nginx solo
    # ve HTTP en el puerto 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css;
    gzip_min_length 256;
    gzip_vary on;
    # El proxy puede agregar Via; sin esto nginx no comprimiría esas respuestas.
    gzip_proxied any;

    expires 10m;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

    # Una carpeta sin index.html (p. ej. /css/) también es «no encontrada».
    error_page 403 404 =404 /404.html;

    location = /404.html {
        internal;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }
}
