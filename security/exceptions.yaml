# Registro de excepciones de seguridad y calidad (constitución §8). Lo valida scripts/ci/check_exceptions.py.
# Reglas: máximo 90 días, responsable con nombre, evidencia en la justificación, plan de remediación.
# En el código, la supresión cita el ID en la misma línea:  // nosemgrep: knock-random-inseguro -- EXC-001
#
# Campos: id · herramienta · regla · alcance (rutas) · justificacion · responsable · creada (AAAA-MM-DD) · vence · plan
#
# Ejemplo (no activo):
#  - id: EXC-001
#    herramienta: semgrep
#    regla: knock-random-inseguro
#    alcance: panel/src/app/shared/demo-data.ts
#    justificacion: generador de datos ficticios para Storybook; no protege nada (evidencia en PR #123)
#    responsable: Erick Trejo Reséndiz
#    creada: 2026-10-20
#    vence: 2026-12-04
#    plan: reemplazar por @faker-js/faker
excepciones:
  - id: EXC-001
    herramienta: semgrep
    regla: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args
    alcance: scripts/hooks/knock_guard.py
    justificacion: >-
      Falso positivo. La llamada usa una lista de argumentos (sin shell, no hay interpolación de comandos) y los
      nombres que recibe `--similar` salen de expresiones regulares de identificadores (`[A-Za-z]\w+`) que no
      pueden empezar con «-»; además se limitan a 8. Evidencia: revisión de scripts/hooks/knock_guard.py (función
      check_new_file) en el PR de KNOCK-26 y primera ejecución de Semgrep en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-14
    vence: 2027-01-12
    plan: validar los nombres con `re.fullmatch` antes de llamar o importar `codemap` en lugar de lanzar un subproceso, y retirar la excepción antes de vencer.
  - id: EXC-002
    herramienta: dependency-review
    regla: licencias-pub-no-reconocidas-como-spdx
    alcance: app/pubspec.lock (los 15 paquetes de pub que lista allow-dependencies-licenses en .github/workflows/ci-pr.yml; por nombre, en cualquier versión)
    justificacion: >-
      Falso positivo de formato, no de licencia. dependency-review-action recibe de pub las licencias en minúsculas (mit,
      bsd-3-clause, mpl-2.0) y no las reconoce como SPDX, y a geolocator_windows@0.2.5 no le detecta ninguna. Se leyó el
      archivo LICENSE de cada paquete en el caché de pub: MIT (geolocator, geolocator_android, geolocator_apple,
      geolocator_platform_interface, geolocator_windows, petitparser, xml), BSD-3-Clause (google_maps_flutter y sus tres
      paquetes de plataforma, stream_transform, win32) y MPL-2.0 (dbus, gsettings); todas están en la lista permitida de
      CONTRIBUTING.md y ninguna en deny-licenses. dbus y gsettings solo las usa geolocator_linux, que Flutter registra
      únicamente en Linux (no está entre los plugins de Android). Límite conocido: el action ignora la versión al comparar
      (src/purl.ts, purlsMatch), así que una versión nueva de estos paquetes queda exenta; mientras la excepción exista, la
      licencia de cualquier actualización de estos 15 se revisa a mano. La comprobación sigue activa para el resto.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-02
    vence: 2027-01-30
    plan: cuando dependency-review-action normalice las licencias de pub (o se cambie de escáner de licencias), quitar allow-dependencies-licenses y esta excepción; antes de vencer, volver a evaluar si siguen haciendo falta y renovar solo con evidencia nueva.
