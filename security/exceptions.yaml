# Registro de excepciones de seguridad y calidad (constitución §8). Lo valida scripts/ci/check_exceptions.py.
# Reglas: máximo 90 días, responsable con nombre, evidencia en la justificación, plan de remediación.
# En el código, la supresión cita el ID en la misma línea:  // nosemgrep: knock-random-inseguro -- EXC-001
#
# Campos: id · herramienta · regla · alcance (rutas) · justificacion · responsable · creada (AAAA-MM-DD) · vence · plan
#
# Ejemplo (no activo):
#  - id: EXC-001
#    herramienta: semgrep
#    regla: knock-random-inseguro
#    alcance: panel/src/app/shared/demo-data.ts
#    justificacion: generador de datos ficticios para Storybook; no protege nada (evidencia en PR #123)
#    responsable: Erick Trejo Reséndiz
#    creada: 2026-10-20
#    vence: 2026-12-04
#    plan: reemplazar por @faker-js/faker
excepciones:
  - id: EXC-001
    herramienta: semgrep
    regla: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args
    alcance: scripts/hooks/knock_guard.py
    justificacion: >-
      Falso positivo. La llamada usa una lista de argumentos (sin shell, no hay interpolación de comandos) y los
      nombres que recibe `--similar` salen de expresiones regulares de identificadores (`[A-Za-z]\w+`) que no
      pueden empezar con «-»; además se limitan a 8. Evidencia: revisión de scripts/hooks/knock_guard.py (función
      check_new_file) en el PR de KNOCK-26 y primera ejecución de Semgrep en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-14
    vence: 2027-01-12
    plan: validar los nombres con `re.fullmatch` antes de llamar o importar `codemap` en lugar de lanzar un subproceso, y retirar la excepción antes de vencer.
  - id: EXC-002
    herramienta: dependency-review
    regla: licencias-pub-no-reconocidas-como-spdx
    alcance: app/pubspec.lock (los 19 paquetes de pub que lista allow-dependencies-licenses en .github/workflows/ci-pr.yml; por nombre, en cualquier versión)
    justificacion: >-
      Falso positivo de formato, no de licencia. dependency-review-action recibe de pub las licencias en minúsculas (mit,
      bsd-3-clause, mpl-2.0) y no las reconoce como SPDX, y a geolocator_windows@0.2.5 no le detecta ninguna. Se leyó el
      archivo LICENSE de cada paquete en el caché de pub: MIT (geolocator, geolocator_android, geolocator_apple,
      geolocator_platform_interface, geolocator_windows, petitparser, xml), BSD-3-Clause (google_maps_flutter y sus tres
      paquetes de plataforma, stream_transform, win32, jni y shared_preferences con sus paquetes de plataforma android y foundation, añadidos el 2026-11-03 tras comprobar su licencia en pub.dev) y MPL-2.0 (dbus, gsettings); todas están en la lista permitida de
      CONTRIBUTING.md y ninguna en deny-licenses. dbus y gsettings solo las usa geolocator_linux, que Flutter registra
      únicamente en Linux (no está entre los plugins de Android). Límite conocido: el action ignora la versión al comparar
      (src/purl.ts, purlsMatch), así que una versión nueva de estos paquetes queda exenta; mientras la excepción exista, la
      licencia de cualquier actualización de estos 19 se revisa a mano. La comprobación sigue activa para el resto.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-02
    vence: 2027-01-30
    plan: cuando dependency-review-action normalice las licencias de pub (o se cambie de escáner de licencias), quitar allow-dependencies-licenses y esta excepción; antes de vencer, volver a evaluar si siguen haciendo falta y renovar solo con evidencia nueva.
  - id: EXC-003
    herramienta: gitleaks
    regla: generic-api-key
    alcance: app/packages/knock_api/.knock-manifest.json (ruta exacta, solo esta regla; allowlist estrecha en .gitleaks.toml)
    justificacion: >-
      Falso positivo. El manifiesto del cliente generado (spec 006, KNOCK-220) guarda el SHA-256 del contrato y de cada
      archivo generado para que `flutter test` detecte ediciones a mano. La regla genérica de Gitleaks confunde esas
      sumas, que acompañan a rutas con «api» (lib/api/auth_api.dart, lib/api_client.dart, etc.), con llaves de API. El
      manifiesto es JSON y no admite el comentario `gitleaks:allow` en la línea. Evidencia: 14 hallazgos
      `generic-api-key` en el commit 38c6bcf, todos en este archivo; cada valor es un SHA-256 de 64 caracteres
      hexadecimales de un archivo del repositorio.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-05
    vence: 2027-02-03
    plan: si el generador cambia el formato del manifiesto (sumas sin rutas con «api» o con otro nombre de clave), quitar la allowlist de .gitleaks.toml y esta excepción; antes de vencer, volver a evaluar si sigue haciendo falta.
  - id: EXC-004
    herramienta: gitleaks
    regla: generic-api-key
    alcance: dos huellas exactas en .gitleaksignore, 8735cb22dc6095acc63cccea48ad253f6688f589:app/test/core/sesion/sesion_segura_test.dart:generic-api-key:20 y 1d73fc5454410e9de7ebf0faea441ea3a43d8d81:security/exceptions.yaml:generic-api-key:69
    justificacion: >-
      Falso positivo. Token ficticio de una prueba, sin valor real: la constante ficticia de una prueba de sesión (`_tokenRefresco`)
      en app/test/core/sesion/sesion_segura_test.dart, línea 20. Gitleaks recorre el historial de todas las ramas
      (fetch-depth 0), así que cambiar el valor en un commit nuevo no quita el hallazgo del commit 8735cb2, y no se
      reescribe el historial. Evidencia: ejecución local de gitleaks v8.30.1 sobre la rama
      feature/KNOCK-223-client-security-config (1 hallazgo sin .gitleaksignore, 0 con él). Son dos huellas porque la
      primera versión de esta misma justificación copió el literal del token y Gitleaks lo detectó en el commit
      1d73fc5 (esta excepción, línea 69); ese commit ya está publicado y no se reescribe el historial, así que su
      huella se ignora también. El texto vigente ya no copia el valor.
    responsable: José Julián Hernández Hernández
    creada: 2026-11-05
    vence: 2027-02-03
    plan: cuando el commit 8735cb2 deje de estar en el historial que recorre Gitleaks (por ejemplo, tras un cambio de estrategia de fusión aprobado por José), quitar la línea de .gitleaksignore y esta excepción; antes de vencer, volver a evaluar si sigue haciendo falta.
