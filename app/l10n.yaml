# Traducciones con gen-l10n (TT-MOB-02, spec §8 decisión 8).
# Idioma fuente: español (plantilla y respaldo); inglés es el segundo idioma.
# Los .dart de output-dir se versionan y no se editan a mano:
# se regeneran con `flutter gen-l10n`.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-dir: lib/l10n/generado
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
