name: app
description: "Knock: app móvil para clientes y técnicos (TT-MOB-01)."
publish_to: 'none'

version: 1.0.0+1

# Flutter 3.47.7 stable · Dart 3.13.5 (TT-MOB-01, spec §8 decisión 4).
# TT-CI-01 debe usar la misma versión.
environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Dependencias evaluadas en Memoria.md (KNOCK-24, KNOCK-25). Versión exacta en pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.0.2
  google_maps_flutter: ^2.19.0
  # Misma restricción que fija flutter_localizations en Flutter 3.47.7 (TT-MOB-02).
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  # Spec 006 (KNOCK-220): cliente generado desde contracts/openapi.v1.json con
  # app/tool/generar_cliente_api.py. No se edita a mano. Evaluado en Memoria.md.
  knock_api:
    path: packages/knock_api
  # Transporte del cliente generado (openapi-generator `dart` usa package:http).
  http: 1.6.0
  # KNOCK-228: verificación del celular por SMS con Firebase Phone Auth
  # (ID token para POST /api/v1/auth/firebase). Evaluadas en Memoria.md.
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  # Tokens de la sesión solo en Keystore/Keychain (nunca shared_preferences).
  flutter_secure_storage: 11.2.0
  # deviceId (UUID v4) que genera la app y guarda en almacenamiento seguro.
  uuid: 4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SHA-256 del manifiesto del cliente generado (spec 006, R-04).
  crypto: 3.0.8
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  # gen-l10n (TT-MOB-02): ARB en lib/l10n, configuración en l10n.yaml.
  generate: true
  # Nunito empaquetada (SIL OFL 1.1, licencia en assets/fonts/nunito/OFL.txt).
  # Sin descarga en tiempo de ejecución (TT-MOB-02, spec §8 decisión 2).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
